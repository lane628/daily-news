name: Publish Daily News to NoCode

on:
  schedule:
    # 09:00 China Standard Time (UTC+8)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      news_date:
        description: News date (YYYY-MM-DD); defaults to yesterday in China Standard Time
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nocode-daily-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect, summarize and publish news
        env:
          SUPABASE_URL: ${{ secrets.NOCODE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NOCODE_SUPABASE_ANON_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_DATE: ${{ inputs.news_date }}
        run: python scripts/publish_to_supabase.py
